name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: true
        type: boolean

env:
  FLUTTER_VERSION: '3.35.3'
  # Opt the JS-based actions (checkout, upload-artifact, setup-java, etc.)
  # onto Node.js 24 ahead of the June-2026 forced cutover. Suppresses the
  # "Node.js 20 actions are deprecated" warning on every job.
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # A persistent release key keeps the APK signature identical across
      # workflow runs so devices accept new builds as updates. Without it,
      # each runner generates a fresh debug keystore and installs fail with
      # a package-conflict error.
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/novatv-release.jks

      - name: Build APK
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/novatv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build App Bundle
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/novatv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          # The same APK works on phones, tablets and Android TV — the
          # Leanback flags in AndroidManifest.xml make it discoverable in
          # the TV launcher without a separate build. We publish a second
          # copy under the AndroidTV name so users browsing GitHub Releases
          # know it's a supported target.
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/NovaTV-Android.apk
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/NovaTV-AndroidTV.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/NovaTV-Android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: artifacts/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tarball
        run: |
          mkdir -p artifacts
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../artifacts/NovaTV-Linux-x64.tar.gz .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: artifacts/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create zip
        run: |
          mkdir artifacts
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath artifacts/NovaTV-Windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # Use latest stable Xcode
          ls /Applications/ | grep Xcode
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install pods
        working-directory: macos
        run: pod install --repo-update

      # Signing + notarization uses the same secret names as other kilabyte
      # repos (e.g. mcp-manager) so values can be copied across repos verbatim:
      #   BUILD_CERTIFICATE_BASE64   base64-encoded Developer ID Application .p12
      #   BUILD_CERTIFICATE_PASSWORD .p12 export password
      #   ASC_API_KEY_B64            base64-encoded App Store Connect .p8 API key
      #   ASC_KEY_ID                 App Store Connect key ID
      #   ASC_ISSUER_ID              App Store Connect issuer UUID
      # If any are missing, the build falls back to unsigned.
      - name: Determine signing capability
        id: signing
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_B64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$ASC_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing + notarization enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing; building unsigned macOS app (set BUILD_CERTIFICATE_BASE64, BUILD_CERTIFICATE_PASSWORD, ASC_API_KEY_B64, ASC_KEY_ID, ASC_ISSUER_ID to enable)."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-signing
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          rm "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_B64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build macOS (signed)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk -F '"' '{print $2}')
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "Using signing identity: $SIGNING_IDENTITY"

          flutter build macos --release --config-only
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            ARCHS="x86_64 arm64"

      # Xcode can inject com.apple.security.get-task-allow into the main
      # executable when building Release via Developer ID (the Release config
      # still carries Apple Development defaults from the Flutter template).
      # Apple's notary rejects that. Re-sign the app bundle from the inside
      # out with the explicit Release.entitlements, which doesn't request
      # get-task-allow, to guarantee a clean hardened-runtime signature.
      - name: Re-sign for distribution
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APP_PATH="build/macos/Build/Products/Release/NovaTV.app"
          ENTITLEMENTS="macos/Runner/Release.entitlements"

          # Sign frameworks (no entitlements)
          find "$APP_PATH/Contents/Frameworks" -maxdepth 1 -name "*.framework" -print0 | \
            xargs -0 -I {} codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp "{}"

          # Sign helper executables if any
          if [ -d "$APP_PATH/Contents/MacOS" ]; then
            find "$APP_PATH/Contents/MacOS" -type f -perm +111 ! -name "NovaTV" -print0 | \
              xargs -0 -I {} codesign --force --sign "$SIGNING_IDENTITY" \
                --options runtime --timestamp "{}" || true
          fi

          # Re-sign the main executable with explicit entitlements
          codesign --force --sign "$SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            --options runtime --timestamp \
            "$APP_PATH/Contents/MacOS/NovaTV"

          # Re-sign the app bundle itself with the same entitlements
          codesign --force --sign "$SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            --options runtime --timestamp \
            "$APP_PATH"

          # Verify the bundle has no get-task-allow
          echo "--- entitlements of main executable ---"
          codesign -d --entitlements :- "$APP_PATH/Contents/MacOS/NovaTV" || true
          echo "--- verify bundle ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Build macOS (unsigned fallback)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          flutter build macos --release --config-only
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="x86_64 arm64"

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/NovaTV.app"
          ZIP_PATH="$RUNNER_TEMP/NovaTV-notarize.zip"

          # ditto preserves symlinks and bundle structure that the notary service requires.
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --key ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --verbose --type execute "$APP_PATH"

      - name: Create zip
        run: |
          mkdir -p artifacts
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent NovaTV.app "$GITHUB_WORKSPACE/artifacts/NovaTV-macOS.zip"

      - name: Clean up keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: artifacts/

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p artifacts
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r artifacts/NovaTV-iOS.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: artifacts/

  release:
    needs: [build-android, build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    # Only create GitHub Releases on tag pushes and explicit workflow_dispatch.
    # Previously this also ran on main-branch pushes, which raced with the
    # tag-push run on the same commit — the main-push run (IS_TAG=false →
    # prerelease=true) would often land last and flag the release as
    # Pre-release, hiding it from the "Latest" slot on the releases page.
    # Branch pushes still build the matrix for CI validation; they just don't
    # publish a release.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Use tag name as version (e.g., v1.0.6)
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_TAG=true" >> $GITHUB_OUTPUT
          else
            # Read version from pubspec.yaml (e.g., 1.0.6+1 -> v1.0.6)
            APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
            echo "VERSION=v${APP_VERSION}" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          fi
          echo "Resolved version: $(cat $GITHUB_OUTPUT | grep VERSION)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: NovaTV ${{ steps.get_version.outputs.VERSION }}
          draft: false
          # Main branch commits are prereleases, tagged versions are full releases
          prerelease: ${{ steps.get_version.outputs.IS_TAG != 'true' }}
          files: |
            artifacts/NovaTV-Android.apk
            artifacts/NovaTV-AndroidTV.apk
            artifacts/NovaTV-Android.aab
            artifacts/NovaTV-Linux-x64.tar.gz
            artifacts/NovaTV-Windows-x64.zip
            artifacts/NovaTV-macOS.zip
            artifacts/NovaTV-iOS.ipa
          body: |
            ## NovaTV ${{ steps.get_version.outputs.VERSION }}
            
            ### Downloads
            - **Android (phone/tablet)**: `NovaTV-Android.apk` (direct install) or `NovaTV-Android.aab` (Play Store)
            - **Android TV / Google TV**: `NovaTV-AndroidTV.apk` — same APK as Android, declared with Leanback so it appears in the TV launcher row. Sideload via `adb install` or your TV's Downloader app
            - **Linux**: `NovaTV-Linux-x64.tar.gz`
            - **Windows**: `NovaTV-Windows-x64.zip`
            - **macOS**: `NovaTV-macOS.zip`
            - **iOS**: `NovaTV-iOS.ipa` (requires sideloading - unsigned)
            
            ### Notes
            - iOS build is unsigned and requires sideloading via AltStore, Sideloadly, or similar tools
            - macOS build is signed with Developer ID and notarized when CI secrets are configured; otherwise it is unsigned and you may need to right-click → Open to bypass Gatekeeper
