name: novaiptv
description: "Nova IPTV - A modern cross-platform IPTV player with M3U and EPG support"
publish_to: 'none'
version: 1.0.23+23

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Video Player - Cross-platform with HLS/DASH/RTMP support
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Chromecast / Google Cast (pure-Dart CastV2 — works on desktop + mobile).
  # Vendored under third_party/dart_cast so we can patch ChromecastSession to
  # load a ready-to-play URL directly (bypassing its playlist-rewriting proxy)
  # for our on-device IPTV transmux. See third_party/dart_cast for the diff.
  dart_cast:
    path: third_party/dart_cast

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.1.0

  # Navigation
  go_router: ^14.2.0

  # HTTP & Networking
  dio: ^5.4.0

  # XML/EPG Parsing
  xml: ^6.5.0

  # Synchronized Scrolling
  linked_scroll_controller: ^0.2.0

  # Utilities
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  fpdart: ^1.1.0
  uuid: ^4.4.0
  logger: ^2.2.0
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.8

  # Window management (macOS/Windows/Linux)
  window_manager: ^0.4.3

  # Chromecast device discovery (native Bonjour) + FFI to the system resolver
  # (getaddrinfo) for resolving `.local` mDNS hostnames, which Dart can't.
  bonsoir: ^6.0.1
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  hive_ce_generator: ^1.6.0
  mocktail: ^1.0.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
