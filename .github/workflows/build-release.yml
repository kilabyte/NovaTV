name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: true
        type: boolean

env:
  FLUTTER_VERSION: '3.35.3'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/NovaTV-Android.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/NovaTV-Android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: artifacts/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tarball
        run: |
          mkdir -p artifacts
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../artifacts/NovaTV-Linux-x64.tar.gz .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: artifacts/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create zip
        run: |
          mkdir artifacts
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath artifacts/NovaTV-Windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # Use latest stable Xcode
          ls /Applications/ | grep Xcode
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install pods
        working-directory: macos
        run: pod install --repo-update

      - name: Determine signing capability
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          NOTARY_USER: ${{ secrets.MACOS_NOTARY_USER }}
          CODESIGN_ID: ${{ secrets.MACOS_CODESIGN_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$NOTARY_USER" ] && [ -n "$CODESIGN_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing + notarization enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing; building unsigned macOS app (set MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD, MACOS_CODESIGN_ID, MACOS_NOTARY_USER, MACOS_NOTARY_PWD, MACOS_TEAM_ID to enable)."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Prepend our keychain to the search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[\"[:space:]]//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build macOS (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          CODESIGN_ID: ${{ secrets.MACOS_CODESIGN_ID }}
        run: |
          flutter build macos --release --config-only
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODESIGN_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            ARCHS="x86_64 arm64"

      - name: Build macOS (unsigned fallback)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          flutter build macos --release --config-only
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="x86_64 arm64"

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARY_USER: ${{ secrets.MACOS_NOTARY_USER }}
          NOTARY_PWD: ${{ secrets.MACOS_NOTARY_PWD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/NovaTV.app"
          ZIP_PATH="$RUNNER_TEMP/NovaTV-notarize.zip"

          # ditto preserves symlinks and bundle structure that the notary service requires.
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$NOTARY_USER" \
            --password "$NOTARY_PWD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          spctl --assess --verbose --type execute "$APP_PATH"

      - name: Create zip
        run: |
          mkdir -p artifacts
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent NovaTV.app "$GITHUB_WORKSPACE/artifacts/NovaTV-macOS.zip"

      - name: Clean up keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: artifacts/

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p artifacts
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r artifacts/NovaTV-iOS.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: artifacts/

  release:
    needs: [build-android, build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    # Release on: tag push, main branch push, or workflow_dispatch with create_release=true
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Use tag name as version (e.g., v1.0.6)
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_TAG=true" >> $GITHUB_OUTPUT
          else
            # Read version from pubspec.yaml (e.g., 1.0.6+1 -> v1.0.6)
            APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
            echo "VERSION=v${APP_VERSION}" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          fi
          echo "Resolved version: $(cat $GITHUB_OUTPUT | grep VERSION)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: NovaTV ${{ steps.get_version.outputs.VERSION }}
          draft: false
          # Main branch commits are prereleases, tagged versions are full releases
          prerelease: ${{ steps.get_version.outputs.IS_TAG != 'true' }}
          files: |
            artifacts/NovaTV-Android.apk
            artifacts/NovaTV-Android.aab
            artifacts/NovaTV-Linux-x64.tar.gz
            artifacts/NovaTV-Windows-x64.zip
            artifacts/NovaTV-macOS.zip
            artifacts/NovaTV-iOS.ipa
          body: |
            ## NovaTV ${{ steps.get_version.outputs.VERSION }}
            
            ### Downloads
            - **Android**: `NovaTV-Android.apk` (direct install) or `NovaTV-Android.aab` (Play Store)
            - **Linux**: `NovaTV-Linux-x64.tar.gz`
            - **Windows**: `NovaTV-Windows-x64.zip`
            - **macOS**: `NovaTV-macOS.zip`
            - **iOS**: `NovaTV-iOS.ipa` (requires sideloading - unsigned)
            
            ### Notes
            - iOS build is unsigned and requires sideloading via AltStore, Sideloadly, or similar tools
            - macOS build is signed with Developer ID and notarized when CI secrets are configured; otherwise it is unsigned and you may need to right-click → Open to bypass Gatekeeper
